name: Sync Sleeper data

on:
  # Off the top of the hour on purpose — GitHub's own docs warn that ":00" is
  # the highest-congestion moment for Actions scheduling (every repo on
  # earth tends to pick it), and under load a scheduled trigger can be
  # dropped outright rather than just delayed. :17 avoids that crowd.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      - name: Run sync
        id: sync
        env:
          SEASON: ${{ vars.SEASON }}
          AFC_SLEEPER_LEAGUE_ID: ${{ vars.AFC_SLEEPER_LEAGUE_ID }}
          NFC_SLEEPER_LEAGUE_ID: ${{ vars.NFC_SLEEPER_LEAGUE_ID }}
          PLAYOFF_START_WEEK: ${{ vars.PLAYOFF_START_WEEK }}
          SUPER_BOWL_WEEK: ${{ vars.SUPER_BOWL_WEEK }}
          PLAYOFF_RESEED: ${{ vars.PLAYOFF_RESEED }}
        run: |
          set -o pipefail
          npm run sync -w packages/sync --silent | tee sync-output.log
          SUMMARY=$(grep '^sync run-' sync-output.log | tail -n1)
          echo "summary=${SUMMARY:-sync completed (no summary line found)}" >> "$GITHUB_OUTPUT"

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ config/; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/ config/
          git commit -m "chore(sync): ${{ steps.sync.outputs.summary }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN (as the commit above is)
      # does NOT trigger other workflows' `push` events — GitHub's own
      # anti-loop safeguard. deploy.yml would otherwise never run after an
      # automated sync. Explicitly dispatching it is the documented
      # workaround; only do it when there was actually something new to
      # deploy.
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
